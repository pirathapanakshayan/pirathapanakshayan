name: Update profile stats

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build SYSTEM_STATS, contribution grid + activity log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}   # optional: read-only PAT so private repos count too
          USERNAME: ${{ github.repository_owner }}
          TZ: Asia/Colombo   # count days in Sri Lanka time, like github.com
        run: python3 .github/scripts/stats_card.py

      - name: Commit & push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          git commit -m "update profile stats" || echo "no changes"
          git push

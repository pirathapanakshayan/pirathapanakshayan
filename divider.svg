<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#0F0F0F" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#DEDEDE"/>
      <stop offset="1" stop-color="#0F0F0F" stop-opacity="0"/>
    </linearGradient>
    <style>
      .run{animation:run 4s ease-in-out infinite}
      @keyframes run{0%{transform:translateX(-200px)}50%{transform:translateX(1200px)}100%{transform:translateX(-200px)}}
    </style>
  </defs>
  <line x1="0" y1="12" x2="1200" y2="12" stroke="#4D4D4D" stroke-width="1"/>
  <rect class="run" x="0" y="11" width="200" height="2" fill="url(#g)"/>
  <rect x="594" y="6" width="12" height="12" fill="#0F0F0F" stroke="#BCBCBC" transform="rotate(45 600 12)"/>
</svg>

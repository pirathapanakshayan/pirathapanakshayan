<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="72" viewBox="0 0 1200 72">
<defs><style>@font-face{font-family:'HUD';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'MONO';src:url(data:font/woff2;base64,) format('woff2');}
.d{font-family:'HUD',sans-serif;font-weight:700}
.m{font-family:'MONO',monospace}
.blink{animation:blink 1.2s steps(1) infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.spin{animation:spin 24s linear infinite}
.spinr{animation:spin 16s linear infinite reverse}
.flow{stroke-dasharray:60 900;animation:flow 5s linear infinite}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flow{from{stroke-dashoffset:960}to{stroke-dashoffset:0}}

.sweep{animation:sw 3.5s ease-in-out infinite}@keyframes sw{0%{transform:translateX(0)}100%{transform:translateX(780px)}}</style></defs>
<path d="M0 14H66V58H12L0 46Z" fill="#FFD600"/>
<text x="33" y="44" class="m" font-size="18" fill="#0A0A0A" text-anchor="middle" font-weight="700">01</text>
<text x="86" y="48" class="d" font-size="32" fill="#C9C9C9" letter-spacing="3">ABOUT_ME</text>
<path d="M276 36H1080" stroke="#2A2A2A" stroke-width="1.5" stroke-dasharray="1 0"/>
<rect class="sweep" x="276" y="35" width="40" height="3" fill="#FFD600"/>
<circle cx="1094" cy="36" r="4" fill="#FFD600" class="blink"/>
<text x="1200" y="30" class="m" font-size="11" fill="#6B6B6B" text-anchor="end">MODULE_01 //</text>
<text x="1200" y="46" class="m" font-size="11" fill="#FFD600" text-anchor="end">IDENTITY</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120">
<defs><style>@font-face{font-family:'HUD';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'MONO';src:url(data:font/woff2;base64,) format('woff2');}
.d{font-family:'HUD',sans-serif;font-weight:700}
.m{font-family:'MONO',monospace}
.blink{animation:blink 1.2s steps(1) infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.spin{animation:spin 24s linear infinite}
.spinr{animation:spin 16s linear infinite reverse}
.flow{stroke-dasharray:60 900;animation:flow 5s linear infinite}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flow{from{stroke-dashoffset:960}to{stroke-dashoffset:0}}
</style>
<pattern id="haz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="16" fill="#FFD600"/></pattern></defs>
<rect x="0" y="0" width="1200" height="14" fill="url(#haz)"/>
<path d="M0 14H1200V96L1176 120H24L0 96Z" fill="#121212" stroke="#2A2A2A"/>
<text x="600" y="64" class="d" font-size="30" fill="#C9C9C9" text-anchor="middle" letter-spacing="8">END_OF_TRANSMISSION</text>
<text x="600" y="92" class="m" font-size="12" fill="#FFD600" text-anchor="middle" letter-spacing="3">PIRATHAPANAKSHAYAN // 2026 // SESSION CLOSED</text>
<rect x="938" y="58" width="14" height="4" fill="#FFD600" class="blink"/>
<circle cx="60" cy="58" r="5" fill="#FFD600" class="pulse"/><circle cx="1140" cy="58" r="5" fill="#FFD600" class="pulse"/>
</svg>
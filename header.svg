<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F0F0F"/>
      <stop offset="0.6" stop-color="#2B2B2B"/>
      <stop offset="1" stop-color="#0F0F0F"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#979797"/>
      <stop offset="0.5" stop-color="#DEDEDE"/>
      <stop offset="1" stop-color="#979797"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#4D4D4D" stroke-width="0.5" opacity="0.35"/>
    </pattern>
    <style>
      .ring{fill:none;stroke-width:1.2;transform-origin:950px 160px}
      .r1{stroke:#DEDEDE;animation:spin 18s linear infinite}
      .r2{stroke:#979797;animation:spin 12s linear infinite reverse}
      .r3{stroke:#717171;animation:spin 26s linear infinite}
      .cube{transform-origin:950px 160px;animation:float 5s ease-in-out infinite}
      .dot{fill:#BCBCBC;animation:drift 9s linear infinite}
      .name{font:700 64px Georgia,'Playfair Display','Times New Roman',serif;letter-spacing:2px}
      .tag{font:400 20px 'Courier New',Consolas,monospace;fill:#BCBCBC}
      .small{font:400 13px 'Courier New',Consolas,monospace;fill:#717171;letter-spacing:4px}
      .cursor{fill:#DEDEDE;animation:blink 1s steps(1) infinite}
      .type{clip-path:inset(0 100% 0 0);animation:typing 4s steps(34) 0.6s forwards}
      .fade{opacity:0;animation:fadein 1.2s ease 0.2s forwards}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes float{0%,100%{transform:translateY(-6px)}50%{transform:translateY(6px)}}
      @keyframes drift{from{transform:translateY(0);opacity:0}20%{opacity:.8}to{transform:translateY(-320px);opacity:0}}
      @keyframes blink{50%{opacity:0}}
      @keyframes typing{to{clip-path:inset(0 0 0 0)}}
      @keyframes fadein{to{opacity:1}}
    </style>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>

  <!-- rising particles -->
  <g>
    <circle class="dot" cx="80" cy="330" r="1.6"/>
    <circle class="dot" cx="260" cy="340" r="1.2" style="animation-delay:-3s"/>
    <circle class="dot" cx="420" cy="335" r="1.8" style="animation-delay:-6s"/>
    <circle class="dot" cx="610" cy="345" r="1.2" style="animation-delay:-1.5s"/>
    <circle class="dot" cx="760" cy="330" r="1.5" style="animation-delay:-4.5s"/>
    <circle class="dot" cx="1110" cy="340" r="1.3" style="animation-delay:-7.5s"/>
  </g>

  <!-- 3D-feel orbit rings -->
  <ellipse class="ring r1" cx="950" cy="160" rx="120" ry="40"/>
  <ellipse class="ring r2" cx="950" cy="160" rx="40" ry="120"/>
  <ellipse class="ring r3" cx="950" cy="160" rx="100" ry="100" stroke-dasharray="4 10"/>

  <!-- isometric cube -->
  <g class="cube">
    <polygon points="950,115 995,140 950,165 905,140" fill="#DEDEDE"/>
    <polygon points="905,140 950,165 950,215 905,190" fill="#717171"/>
    <polygon points="995,140 950,165 950,215 995,190" fill="#2B2B2B" stroke="#4D4D4D"/>
  </g>

  <!-- text -->
  <g class="fade">
    <text x="70" y="92" class="small">— HELLO WORLD, I'M</text>
    <text x="70" y="168" class="name" fill="url(#shine)">PIRATHAPAN</text>
  </g>
  <g class="type">
    <text x="72" y="220" class="tag">&gt; student · developer · learner_</text>
  </g>
  <rect class="cursor" x="72" y="238" width="12" height="3"/>
  <line x1="70" y1="270" x2="520" y2="270" stroke="#4D4D4D"/>
  <text x="70" y="294" class="small">CODE · BUILD · BREAK · REPEAT</text>
</svg>
